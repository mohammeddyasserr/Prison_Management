{% extends "base.html" %}
{% block title %}Record Medical Visit{% endblock %}
{% block page_title %}Record Medical Visit{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px;">
    <form method="POST" action="/healthcare/visits/add">
        <div class="form-group">
            <label>Inmate *</label>
            <select name="inmate_id" class="form-control" required>
                <option value="">— Select —</option>
                {% for i in inmates %}
                    <option value="{{ i.inmate_id }}">{{ i.full_name }} (ID: {{ i.inmate_id }})</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Doctor *</label>
            <select name="doctor_id" class="form-control" required>
                <option value="">— Select —</option>
                {% for d in doctors %}
                    <option value="{{ d.national_id }}">{{ d.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Date & Time *</label>
            <input type="datetime-local" name="date_time" class="form-control" required>
        </div>
        <div class="form-group">
            <label>Diagnosis</label>
            <input type="text" name="diagnosis" class="form-control">
        </div>
        <div class="form-group">
            <label>Description / Notes</label>
            <textarea name="description" class="form-control" rows="3"></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Record Visit</button>
        <a href="/healthcare" class="btn btn-outline">Cancel</a>
    </form>
</div>
{% endblock %}
