{% extends "base.html" %}
{% block title %}{{ 'Edit' if prison else 'Add' }} Prison{% endblock %}
{% block page_title %}{{ 'Edit' if prison else 'Add New' }} Prison{% endblock %}

{% block content %}
<div class="card" style="max-width: 800px;">
    <form method="POST" action="{{ '/prisons/' ~ prison.prison_id ~ '/edit' if prison else '/prisons/add' }}">
        <!-- PRD 2.2.1: Core Facility Information -->
        <h3 class="mb-2">Core Facility Information</h3>
        <div class="form-row">
            <div class="form-group">
                <label>Prison Name</label>
                <input type="text" name="name" class="form-control" value="{{ prison.name if prison else '' }}" required>
            </div>
            <div class="form-group">
                <label>Location</label>
                <input type="text" name="location" class="form-control" value="{{ prison.location if prison else '' }}" required
                       placeholder="City / Governorate">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Type</label>
                <select name="type" class="form-control">
                    {% for t in ['Maximum Security', 'Minimum Security', 'Remand', 'Juvenile', "Women's"] %}
                        <option {% if prison and prison.type == t %}selected{% endif %}>{{ t }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>Security Level</label>
                <select name="security_level" class="form-control">
                    {% for sl in ['Maximum', 'High', 'Medium', 'Minimum'] %}
                        <option {% if prison and prison.security_level == sl %}selected{% endif %}>{{ sl }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>Total Capacity</label>
                <input type="number" name="total_capacity" class="form-control"
                       value="{{ prison.total_capacity if prison else '' }}" required min="1">
            </div>
        </div>
        <div class="form-group">
            <label>Assign Manager</label>
            <select name="manager_id" class="form-control">
                <option value="">— No Manager —</option>
                {% for m in managers %}
                    <option value="{{ m.national_id }}"
                        {% if prison and prison.manager_id == m.national_id %}selected{% endif %}>
                        {{ m.name }} ({{ m.national_id }})
                    </option>
                {% endfor %}
            </select>
        </div>

        <!-- PRD 2.2.5: Facility Features -->
        <h3 class="mt-3 mb-2">Facility Features</h3>
        <div class="checkbox-group">
            <input type="checkbox" name="infirmary" value="1"
                   {% if features and features.infirmary %}checked{% endif %}>
            <label>Infirmary / Hospital</label>
        </div>
        <div class="checkbox-group">
            <input type="checkbox" name="workshops" value="1"
                   {% if features and features.workshops %}checked{% endif %}>
            <label>Workshops</label>
        </div>
        <div class="checkbox-group">
            <input type="checkbox" name="agricultural_ward" value="1"
                   {% if features and features.agricultural_ward %}checked{% endif %}>
            <label>Agricultural Ward</label>
        </div>
        <div class="checkbox-group">
            <input type="checkbox" name="visitation_hall" value="1"
                   {% if features and features.visitation_hall %}checked{% endif %}>
            <label>Visitation Hall</label>
        </div>
        <div class="form-group">
            <label>Visitation Hall Capacity</label>
            <input type="number" name="visitation_hall_capacity" class="form-control" style="width:200px"
                   value="{{ features.visitation_hall_capacity if features else 0 }}" min="0">
        </div>

        <div class="mt-3">
            <button type="submit" class="btn btn-primary">
                {{ 'Update Prison' if prison else 'Create Prison' }}
            </button>
            <a href="/prisons" class="btn btn-outline">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
