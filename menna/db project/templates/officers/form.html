{% extends "base.html" %}
{% block title %}Add Staff{% endblock %}
{% block page_title %}Add Staff Member{% endblock %}

{% block content %}
<!-- PRD 3.1: Super Admin manages user accounts and role assignments -->
<div class="card" style="max-width: 700px;">
    <form method="POST" action="/officers/add">
        <div class="form-row">
            <div class="form-group">
                <label>National ID *</label>
                <input type="text" name="national_id" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Full Name *</label>
                <input type="text" name="name" class="form-control" required>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" class="form-control">
            </div>
            <div class="form-group">
                <label>Phone</label>
                <input type="text" name="phone" class="form-control">
            </div>
        </div>
        <div class="form-group">
            <label>Address</label>
            <input type="text" name="address" class="form-control">
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Role *</label>
                <select name="role" class="form-control" required>
                    <option value="officer">Officer</option>
                    <option value="prison_manager">Prison Manager</option>
                </select>
            </div>
            <div class="form-group">
                <label>Assigned Prison</label>
                <select name="prison_id" class="form-control">
                    <option value="0">— None —</option>
                    {% for p in prisons %}
                        <option value="{{ p.prison_id }}">{{ p.name }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <div class="form-group">
            <label>Password *</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary">Create Account</button>
        <a href="/officers" class="btn btn-outline">Cancel</a>
    </form>
</div>
{% endblock %}
