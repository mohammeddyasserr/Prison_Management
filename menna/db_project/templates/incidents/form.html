{% extends "base.html" %}
{% block title %}Report Incident{% endblock %}
{% block page_title %}Report Incident{% endblock %}

{% block content %}
<!-- PRD 6.1: Incident report form with all specified fields -->
<div class="card" style="max-width: 800px;">
    <form method="POST" action="/incidents/add">
        <div class="form-row">
            <div class="form-group">
                <label>Incident Type *</label>
                <select name="type" class="form-control" required>
                    <option value="">— Select -</option>
                    <option>Fight</option><option>Self-Harm</option>
                    <option>Escape Attempt</option><option>Property Damage</option>
                    <option>Assault on Staff</option><option>Other</option>
                </select>
            </div>
            <div class="form-group">
                <label>Date & Time</label>
                <input type="datetime-local" name="date_time" class="form-control">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Block</label>
                <select name="block_id" class="form-control">
                    <option value="">— Select —</option>
                    {% for b in blocks %}
                        <option value="{{ b.block_id }}">{{ b.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>Cell ID (optional)</label>
                <input type="number" name="cell_id" class="form-control" placeholder="Cell number">
            </div>
        </div>

        <div class="form-group">
            <label>Description *</label>
            <textarea name="description" class="form-control" rows="4" required
                      placeholder="Narrative description of the incident"></textarea>
        </div>
        <div class="form-group">
            <label>Action Taken</label>
            <textarea name="action_taken" class="form-control" rows="3"
                      placeholder="Immediate response measures applied"></textarea>
        </div>

        <!-- PRD 6.1: Inmates Involved -->
        <div class="form-group">
            <label>Inmates Involved</label>
            <div class="multi-select">
                {% for inmate in inmates %}
                <label>
                    <input type="checkbox" name="inmate_ids" value="{{ inmate.inmate_id }}">
                    {{ inmate.full_name }} (ID: {{ inmate.inmate_id }})
                </label>
                {% endfor %}
            </div>
        </div>

        <!-- PRD 6.1: Staff Involved -->
        <div class="form-group">
            <label>Staff Involved</label>
            <div class="multi-select">
                {% for s in staff %}
                <label>
                    <input type="checkbox" name="staff_ids" value="{{ s.national_id }}">
                    {{ s.name }} ({{ s.role }})
                </label>
                {% endfor %}
            </div>
        </div>

        <!-- PRD 6.1: Witnesses -->
        <div class="form-group">
            <label>Witnesses (IDs)</label>
            <div class="multi-select">
                {% for inmate in inmates %}
                <label>
                    <input type="checkbox" name="witness_ids" value="{{ inmate.inmate_id }}">
                    {{ inmate.full_name }}
                </label>
                {% endfor %}
            </div>
        </div>

        <div class="mt-2">
            <button type="submit" class="btn btn-primary">Submit Incident Report</button>
            <a href="/incidents" class="btn btn-outline">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
