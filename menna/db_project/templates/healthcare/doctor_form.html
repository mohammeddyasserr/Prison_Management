{% extends "base.html" %}
{% block title %}Add Doctor{% endblock %}
{% block page_title %}Add Doctor{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px;">
    <form method="POST" action="/healthcare/doctors/add">
        <div class="form-row">
            <div class="form-group">
                <label>National ID *</label>
                <input type="text" name="national_id" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Name *</label>
                <input type="text" name="name" class="form-control" required>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Address</label>
                <input type="text" name="address" class="form-control">
            </div>
            <div class="form-group">
                <label>Phone</label>
                <input type="text" name="phone" class="form-control">
            </div>
        </div>
        <div class="form-group">
            <label>Assigned Prison *</label>
            <select name="prison_id" class="form-control" required>
                {% for p in prisons %}
                    <option value="{{ p.prison_id }}">{{ p.name }}</option>
                {% endfor %}
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Add Doctor</button>
        <a href="/healthcare" class="btn btn-outline">Cancel</a>
    </form>
</div>
{% endblock %}
