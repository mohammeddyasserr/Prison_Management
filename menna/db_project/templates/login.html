<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — CPMS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h1>CPMS</h1>
            <p class="subtitle">Centralized Prison Management System</p>

            {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
            {% endif %}

            <form method="POST" action="/login">
                <div class="form-group">
                    <label for="national_id">Username / Email / National ID</label>
                    <input type="text" id="national_id" name="national_id" class="form-control"
                           placeholder="Enter username, email, or National ID" required autofocus>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-control"
                           placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn btn-primary">Sign In</button>
            </form>

            <div class="mt-2 text-center text-sm" style="color:#94a3b8">
                Demo: <strong>ADMIN001</strong> / <strong>admin123</strong>
            </div>
            <div class="mt-2 text-center">
                <a href="/visit-request" class="text-sm">Public Visit Request Portal →</a>
            </div>
        </div>
    </div>
</body>
</html>
